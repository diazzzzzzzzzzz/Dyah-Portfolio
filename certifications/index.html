    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

<body>

<header class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <img src="../images/cat-lover.png" alt="Dyah Portfolio">
    </a>

    <ul class="nav-links">
        <li><a href="../index.html#header">Home</a></li>
        <li><a href="../index.html#about">About</a></li>
        <li><a href="../index.html#portfolio" class="active">Portfolio</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
    </ul>
  </div>
</header>



<section class="detail-hero">
    <div class="container">
        <h1>Certifications</h1>
        <p>Language Proficiency & Professional Development</p>
    </div>
</section>


<section class="detail-content">
<div class="container">

    
    <div class="detail-block">
        <h2>Language Certifications</h2>

        <div class="certificate-grid certificate-grid--certifications">

            
            <figure class="image-item">
                <img src="../images/ukbi-certificate.jpeg"
                     alt="UKBI Certificate"
                     class="clickable-image">
                <figcaption>
                    <strong>UKBI (Uji Kemahiran Berbahasa Indonesia)</strong><br>
                    Score: <strong>677 – Sangat Unggul</strong><br>
                    Test Date: 16 June 2025
                </figcaption>
            </figure>

            <!-- IELTS -->
            <figure class="image-item">
                <img src="../images/ielts-certificate.jpeg"
                     alt="IELTS Academic Certificate"
                     class="clickable-image">
                <figcaption>
                    <strong>IELTS Academic</strong><br>
                    Overall Band Score: <strong>6.5</strong><br>
                    Test Date: 30 December 2025
                </figcaption>
            </figure>

        </div>
    </div>


    
    <div class="detail-block">
        <h2>Professional Certification</h2>

        <div class="certificate-grid">

            <figure class="image-item">
                <img src="../images/generative-ai.jpg"
                     alt="Career Essentials in Generative AI Certificate"
                     class="clickable-image">
                <figcaption>
                    <strong>Career Essentials in Generative AI</strong><br>
                    by Microsoft & LinkedIn<br>
                    Issued: September 2024
                </figcaption>
            </figure>

        </div>
    </div>

</div>
</section>



<div id="imageModal" class="image-modal">
    <span class="modal-close">&times;</span>

    <button class="modal-nav prev">&#10094;</button>
    <button class="modal-nav next">&#10095;</button>

    <div class="modal-wrapper">
        <img class="modal-content" id="modalImg">
        <p class="modal-caption" id="modalCaption"></p>
    </div>
</div>

<script src="../modal.js"></script>

</html>
